<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de turmas | NotaDez</title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/admin/paginas.css">
  </head>
  <body>
    <div id="app" data-page="adicionar-turma" data-role="admin" data-title="Cadastro de turmas">
      <div class="shell">
        <aside class="side" data-component="sidebar"></aside>
        <main class="main">
          <div data-component="header"></div>
          <section class="content">
            <article class="admin-page">
              <div class="admin-page-intro">
                <span class="admin-eyebrow">Organiza&ccedil;&atilde;o acad&ecirc;mica</span>
                <h2>Cadastro de turmas</h2>
                <p>Cadastre uma turma e associe-a ao curso e per&iacute;odo letivo.</p>
              </div>
              <section class="admin-form-card admin-form-card-narrow">
                <div class="admin-card-heading">
                  <span class="admin-card-icon" aria-hidden="true">&#43;</span>
                  <div><h3>Dados da turma</h3><p>Preencha os dados da oferta.</p></div>
                </div>
                <div class="admin-form-body">
                  <div class="admin-field-grid">
                    <label class="admin-field">
                      <span>C&oacute;digo da turma</span>
                      <input name="codigo" placeholder="Ex.: ADS-2026-1A" required>
                    </label>
                    <label class="admin-field">
                      <span>Curso</span>
                      <select name="cursoId" required>
                        <option value="" selected disabled>Carregando cursos...</option>
                      </select>
                    </label>
                    <label class="admin-field">
                      <span>Per&iacute;odo letivo</span>
                      <input name="periodoLetivo" placeholder="Ex.: 2026.1" maxlength="30" required>
                    </label>
                    <label class="admin-field">
                      <span>Vagas</span>
                      <input name="vagas" type="number" min="1" max="300" step="1" required>
                    </label>
                  </div>
                  <button class="admin-button" type="button">Cadastrar turma</button>
                  <p class="admin-local-note" role="status" aria-live="polite"></p>
                </div>
              </section>
            </article>
          </section>
          <div data-component="footer"></div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js"></script>
    <script src="../../js/admin/adicionar-turma.js"></script>
  </body>
</html>
