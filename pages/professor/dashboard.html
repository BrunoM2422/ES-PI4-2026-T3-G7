<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    Painel Docente | NotaDez
  </title>
  <link rel="stylesheet" href="../../css/shared/style.css">
  <link rel="stylesheet" href="../../css/professor/paginas.css">
  <link rel="stylesheet" href="../../css/shared/notificacoes.css">
</head>

<body>
  <div id="app" data-page="dashboard" data-role="professor" data-title="Painel Docente">
    <div class="shell">
      <aside class="side" data-component="sidebar">
      </aside>
      <main class="main">
        <div data-component="header">
        </div>
        <section class="content">
          <article class="teacher-host">
            <div class="teacher-dashboard">
              <section class="teacher-stat-grid">
                <article class="teacher-stat">
                  <span>Turmas Ativas</span><strong>—</strong><small>Dados não disponíveis.</small><i
                    aria-hidden="true">&#127891;</i>
                </article>
                <article class="teacher-stat teacher-stat-review">
                  <span>Avaliações Pendentes</span><strong>—</strong><small>Dados não disponíveis.</small><i
                    aria-hidden="true">&#9998;</i>
                </article>
              </section>
              <div class="teacher-dashboard-grid">
                <section class="teacher-panel teacher-agenda">
                  <h2>
                    Hoje - Agenda Acadêmica
                  </h2>
                  <p class="teacher-empty-message">
                    Nenhuma atividade agendada para hoje.
                  </p>
                </section>
                <section class="teacher-panel teacher-activity">
                  <h2>
                    Registro de Atividades
                  </h2>
                  <p class="teacher-empty-message">
                    Nenhuma atividade recente.
                  </p>
                </section>
                <section class="teacher-panel teacher-notifications">
                  <div class="notif-panel-heading">
                    <h2>
                      Notificações Recentes
                    </h2>
                    <button type="button" id="btn-marcar-todas-lidas" class="notif-btn" hidden>Ler
                      todos</button>
                  </div>
                  <div class="notif-list" id="notif-list">
                    <p class="teacher-empty-message">
                      Nenhuma notificação recente.
                    </p>
                  </div>
                </section>
              </div>
            </div>
          </article>
        </section>
        <div data-component="footer">
        </div>
      </main>
    </div>
  </div>
  <script src="../../js/shared/app.js"></script>
  <script src="../../js/shared/notificacoes.js"></script>
  <script src="../../js/professor/dashboard.js"></script>
</body>

</html>
