<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de docente | NotaDez</title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/admin/paginas.css">
  </head>
  <body>
    <div id="app" data-page="adicionar-docente" data-role="admin" data-title="Cadastro de docente">
      <div class="shell">
        <aside class="side" data-component="sidebar"></aside>
        <main class="main">
          <div data-component="header"></div>
          <section class="content">
            <article class="admin-page">
              <div class="admin-page-intro">
                <span class="admin-eyebrow">Gest&atilde;o acad&ecirc;mica</span>
                <h2>Cadastro de docente</h2>
                <p>Registre os dados do docente e as &aacute;reas em que atua.</p>
              </div>
              <section class="admin-form-card admin-form-card-narrow">
                <div class="admin-card-heading">
                  <span class="admin-card-icon" aria-hidden="true">&#43;</span>
                  <div><h3>Dados do docente</h3><p>Os campos marcados s&atilde;o obrigat&oacute;rios.</p></div>
                </div>
                <div class="admin-form-body">
                  <div class="admin-field-grid">
                    <label class="admin-field admin-field-wide"><span>Nome completo</span><input name="nome" autocomplete="name" required></label>
                    <label class="admin-field"><span>E-mail institucional</span><input name="email" type="email" autocomplete="email" required></label>
                    <label class="admin-field"><span>CPF</span><input name="cpf" inputmode="numeric" placeholder="Informe o CPF" required></label>
                    <label class="admin-field"><span>Instituição</span><input name="instituicao" placeholder="Informe o nome da instituição" required></label>
                    <div class="admin-field admin-field-unavailable"><span>Departamento</span><p>Op&ccedil;&otilde;es n&atilde;o dispon&iacute;veis.</p></div>
                    <label class="admin-field"><span>Especialidade</span><input name="especialidade" required></label>
                    <label class="admin-field admin-field-wide"><span>Telefone</span><input name="telefone" type="tel" autocomplete="tel"></label>
                  </div>
                  <button class="admin-button" type="button">Cadastrar docente</button>
                </div>
              </section>
            </article>
          </section>
          <div data-component="footer"></div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js"></script>
    <script src="../../js/admin/adicionar-docente.js"></script>
  </body>
</html>
