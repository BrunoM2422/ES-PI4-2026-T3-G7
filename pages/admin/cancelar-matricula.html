<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cancelar matr&iacute;cula | NotaDez</title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/admin/paginas.css">
  </head>
  <body>
    <div id="app" data-page="cancelar-matricula" data-role="admin" data-title="Cancelar matr&iacute;cula">
      <div class="shell">
        <aside class="side" data-component="sidebar"></aside>
        <main class="main">
          <div data-component="header"></div>
          <section class="content">
            <article class="admin-page">
              <div class="admin-page-intro">
                <span class="admin-eyebrow">Gest&atilde;o de matr&iacute;culas</span>
                <h2>Cancelar matr&iacute;cula</h2>
                <p>Informe o RA ou e-mail e o CPF do aluno para remover o cadastro e encerrar o acesso.</p>
              </div>
              <section class="admin-form-card admin-form-card-narrow">
                <div class="admin-card-heading admin-card-heading-danger">
                  <span class="admin-card-icon" aria-hidden="true">&#10005;</span>
                  <div><h3>Identifica&ccedil;&atilde;o do aluno</h3><p>Confira os dados antes de cancelar.</p></div>
                </div>
                <div class="admin-form-body">
                  <div class="admin-field-grid">
                    <label class="admin-field"><span>RA ou e-mail institucional</span><input name="matricula" placeholder="Informe o RA ou e-mail" required></label>
                    <label class="admin-field"><span>CPF do aluno</span><input name="cpf" inputmode="numeric" autocomplete="off" placeholder="Informe o CPF do aluno" required></label>
                  </div>
                  <label class="admin-confirm-field"><input type="checkbox" name="confirmacao" required><span>Confirmo que o cadastro e o acesso do aluno ser&atilde;o exclu&iacute;dos.</span></label>
                  <button class="admin-button admin-button-danger" type="button">Confirmar cancelamento</button>
                  <p class="admin-local-note" role="status" aria-live="polite"></p>
                </div>
              </section>
            </article>
          </section>
          <div data-component="footer"></div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js"></script>
    <script src="../../js/admin/matriculas.js"></script>
  </body>
</html>
