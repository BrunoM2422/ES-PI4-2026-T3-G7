<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Notas | NotaDez
    </title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/professor/paginas.css">
  </head>
  <body>
    <div id="app" data-page="notas" data-role="professor" data-title="Notas">
      <div class="shell">
        <aside class="side" data-component="sidebar">
        </aside>
        <main class="main">
          <div data-component="header">
          </div>
          <section class="content">
            <article class="teacher-host">
              <div class="teacher-page">
                <section class="teacher-panel teacher-classes-panel">
                  <div class="teacher-classes-heading"><div><span class="teacher-classes-eyebrow">Ensino</span><h2>Notas</h2><p>Escolha uma disciplina para configurar componentes e lançar notas.</p></div><span class="teacher-class-count" data-grade-count>Carregando...</span></div>
                  <div class="teacher-class-grid" data-grade-cards aria-live="polite"><p class="teacher-empty-message">Carregando disciplinas...</p></div>
                </section>
                <section class="teacher-panel teacher-class-details" data-grade-detail hidden></section>
              </div>
            </article>
          </section>
          <div data-component="footer">
          </div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js">
    </script>
    <script src="../../js/professor/notas.js"></script>
  </body>
</html>
