<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Minhas Turmas | NotaDez
    </title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/professor/paginas.css">
  </head>
  <body>
    <div id="app" data-page="turmas" data-role="professor" data-title="Minhas Turmas">
      <div class="shell">
        <aside class="side" data-component="sidebar">
        </aside>
        <main class="main">
          <div data-component="header">
          </div>
          <section class="content">
            <article class="teacher-host">
              <div class="teacher-page">
                <section class="teacher-panel teacher-classes-panel">
                  <div class="teacher-classes-heading">
                    <div>
                      <span class="teacher-classes-eyebrow">Ensino</span>
                      <h2>Minhas Turmas</h2>
                      <p>Turmas vinculadas às disciplinas que você leciona.</p>
                    </div>
                    <span class="teacher-class-count" data-class-count>Carregando...</span>
                  </div>
                  <div class="teacher-class-grid" data-class-grid aria-live="polite">
                    <p class="teacher-empty-message">Carregando suas turmas...</p>
                  </div>
                </section>
                <section class="teacher-panel teacher-class-details" data-class-details hidden></section>
              </div>
            </article>
          </section>
          <div data-component="footer">
          </div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js">
    </script>
    <script src="../../js/professor/turmas.js">
    </script>
  </body>
</html>
