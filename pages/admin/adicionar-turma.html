<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de turmas | NotaDez</title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/admin/paginas.css">
  </head>
  <body>
    <div id="app" data-page="adicionar-turma" data-role="admin" data-title="Cadastro de turmas">
      <div class="shell">
        <aside class="side" data-component="sidebar"></aside>
        <main class="main">
          <div data-component="header"></div>
          <section class="content">
            <article class="admin-page">
              <div class="admin-page-intro">
                <span class="admin-eyebrow">Organização acadêmica</span>
                <h2>Cadastro de turmas</h2>
                <p>Cadastre uma turma e associe-a ao curso e período letivo.</p>
              </div>
              <section class="admin-form-card admin-form-card-narrow">
                <div class="admin-card-heading">
                  <span class="admin-card-icon" aria-hidden="true">&#43;</span>
                  <div><h3>Dados da turma</h3><p>Preencha os dados da oferta.</p></div>
                </div>
                <div class="admin-form-body">
                  <div class="admin-field-grid">
                    <label class="admin-field">
                      <span>Número da turma</span>
                      <div class="admin-discipline-code">
                        <span class="admin-discipline-prefix" data-code-prefix>--</span>
                        <input name="numeroTurma" type="number" min="1" max="99" step="1" placeholder="1" required>
                      </div>
                      <small class="admin-local-note" data-code-preview>Selecione o semestre para montar o código.</small>
                    </label>
                    <label class="admin-field admin-field-select">
                      <span>Curso</span>
                      <select class="admin-select-balanced" name="cursoId" required>
                        <option value="" selected disabled>Carregando cursos...</option>
                      </select>
                    </label>
                    <label class="admin-field">
                      <span>Período letivo</span>
                      <select name="periodoLetivo" required disabled>
                        <option value="" selected>Selecione um curso primeiro</option>
                      </select>
                    </label>
                    <label class="admin-field">
                      <span>Vagas</span>
                      <input name="vagas" type="number" min="1" max="300" step="1" required>
                    </label>
                  </div>
                  <button class="admin-button" type="button">Cadastrar turma</button>
                  <p class="admin-local-note" role="status" aria-live="polite"></p>
                </div>
              </section>
              <section class="admin-form-card" data-importacao-csv="turmas">
                <div class="admin-card-heading"><span class="admin-card-icon" aria-hidden="true">&#8645;</span><div><h3>Importação por CSV</h3><p>Confira os registros antes de importar.</p></div></div>
                <div class="admin-form-body"><label class="admin-file-field"><strong>Arquivo CSV</strong><small></small><input type="file" accept=".csv,text/csv"></label><p role="status">Selecione um CSV para visualizar os registros.</p><div class="admin-table-wrap"><table class="admin-table" aria-label="Prévia da importação"><thead><tr></tr></thead><tbody></tbody></table></div><button class="admin-button" type="button" disabled>Importar registros válidos</button></div>
              </section>            </article>
          </section>
          <div data-component="footer"></div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js"></script>
    <script src="../../js/admin/adicionar-turma.js"></script>
    <script src="../../js/admin/importacao-csv.js"></script>
  </body>
</html>
