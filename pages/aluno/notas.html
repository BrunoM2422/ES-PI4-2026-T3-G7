<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Notas | NotaDez
    </title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/aluno/paginas.css">
  </head>
  <body>
    <div id="app" data-page="notas" data-role="aluno" data-title="Notas">
      <div class="shell">
        <aside class="side" data-component="sidebar">
        </aside>
        <main class="main">
          <div data-component="header">
          </div>
          <section class="content">
            <article class="student-page-host">
              <div class="student-page-layout">
                <section class="student-page-panel grades-panel">
                  <div class="grades-heading"><div><span class="grades-eyebrow">Desempenho acadêmico</span><h2>Minhas notas</h2><p>Disciplinas em que você está matriculado.</p></div><span class="grades-count" data-grade-count>Carregando...</span></div>
                  <div class="grades-card-grid" data-grade-cards aria-live="polite"><p class="student-dashboard-empty">Carregando disciplinas...</p></div>
                </section>
                <section class="student-page-panel grades-detail" data-grade-detail hidden></section>
              </div>
            </article>
          </section>
          <div data-component="footer">
          </div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js">
    </script>
    <script src="../../js/aluno/notas.js"></script>
  </body>
</html>
