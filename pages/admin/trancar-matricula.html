<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trancar matr&iacute;cula | NotaDez</title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/admin/paginas.css">
  </head>
  <body>
    <div id="app" data-page="trancar-matricula" data-role="admin" data-title="Trancar matr&iacute;cula">
      <div class="shell">
        <aside class="side" data-component="sidebar"></aside>
        <main class="main">
          <div data-component="header"></div>
          <section class="content">
            <article class="admin-page">
              <div class="admin-page-intro">
                <span class="admin-eyebrow">Gest&atilde;o de matr&iacute;culas</span>
                <h2>Trancar matr&iacute;cula</h2>
                <p>Registre o per&iacute;odo de afastamento tempor&aacute;rio do aluno.</p>
              </div>
              <section class="admin-form-card admin-form-card-narrow">
                <div class="admin-card-heading">
                  <span class="admin-card-icon" aria-hidden="true">&#10003;</span>
                  <div><h3>Dados do trancamento</h3><p>Informe a matr&iacute;cula e o per&iacute;odo solicitado.</p></div>
                </div>
                <div class="admin-form-body">
                  <div class="admin-field-grid">
                    <label class="admin-field"><span>Identificador da matr&iacute;cula</span><input name="matricula" placeholder="Informe o identificador da matr&iacute;cula" required></label>
                    <label class="admin-field"><span>CPF do aluno</span><input name="cpf" inputmode="numeric" placeholder="Informe o CPF do aluno" required></label>
                    <label class="admin-field"><span>In&iacute;cio do trancamento</span><input name="inicio" type="date" required></label>
                    <label class="admin-field"><span>Previs&atilde;o de retorno</span><input name="retorno" type="date" required></label>
                    <label class="admin-field admin-field-wide"><span>Justificativa</span><textarea name="justificativa" rows="4" placeholder="Descreva o motivo informado pelo aluno" required></textarea></label>
                  </div>
                  <label class="admin-confirm-field"><input type="checkbox" name="confirmacao" required><span>Confirmo que revisei os dados e o per&iacute;odo informado.</span></label>
                  <button class="admin-button" type="button">Confirmar trancamento</button>
                </div>
              </section>
            </article>
          </section>
          <div data-component="footer"></div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js"></script>
  </body>
</html>
