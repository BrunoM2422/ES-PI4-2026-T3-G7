<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Painel Docente | NotaDez
    </title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/professor/paginas.css">
  </head>
  <body>
    <div id="app" data-page="dashboard" data-role="professor" data-title="Painel Docente">
      <div class="shell">
        <aside class="side" data-component="sidebar">
        </aside>
        <main class="main">
          <div data-component="header">
          </div>
          <section class="content">
            <article class="teacher-host">
              <div class="teacher-dashboard">
                <section class="teacher-stat-grid">
                  <article class="teacher-stat">
                    <span>Turmas Ativas</span><strong>&mdash;</strong><small>Dados n&atilde;o dispon&iacute;veis.</small><i aria-hidden="true">&#127891;</i>
                  </article>
                  <article class="teacher-stat teacher-stat-review">
                    <span>Avalia&ccedil;&otilde;es Pendentes</span><strong>&mdash;</strong><small>Dados n&atilde;o dispon&iacute;veis.</small><i aria-hidden="true">&#9998;</i>
                  </article>
                </section>
                <div class="teacher-dashboard-grid">
                  <section class="teacher-panel teacher-agenda">
                    <h2>
                      Hoje - Agenda Acad&ecirc;mica
                    </h2>
                    <p class="teacher-empty-message">
                      Nenhuma atividade agendada para hoje.
                    </p>
                  </section>
                  <section class="teacher-panel teacher-activity">
                    <h2>
                      Registro de Atividades
                    </h2>
                    <p class="teacher-empty-message">
                      Nenhuma atividade recente.
                    </p>
                  </section>
                  <section class="teacher-panel teacher-notifications">
                    <h2>
                      Notifica&ccedil;&otilde;es Recentes
                    </h2>
                    <p class="teacher-empty-message">
                      Nenhuma notifica&ccedil;&atilde;o recente.
                    </p>
                  </section>
                </div>
              </div>
            </article>
          </section>
          <div data-component="footer">
          </div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js">
    </script>
  </body>
</html>
