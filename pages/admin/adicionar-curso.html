<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de cursos | NotaDez</title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/admin/paginas.css">
  </head>
  <body>
    <div id="app" data-page="adicionar-curso" data-role="admin" data-title="Cadastro de cursos">
      <div class="shell">
        <aside class="side" data-component="sidebar"></aside>
        <main class="main">
          <div data-component="header"></div>
          <section class="content">
            <article class="admin-page">
              <div class="admin-page-intro">
                <span class="admin-eyebrow">Catálogo acadêmico</span>
                <h2>Cadastro de cursos</h2>
                <p>Cadastre um curso para organizar disciplinas, turmas e matrículas.</p>
              </div>
              <section class="admin-form-card admin-form-card-narrow">
                <div class="admin-card-heading">
                  <span class="admin-card-icon" aria-hidden="true">&#43;</span>
                  <div><h3>Dados do curso</h3><p>Defina as informações principais do programa.</p></div>
                </div>
                <div class="admin-form-body">
                  <div class="admin-field-grid">
                    <label class="admin-field"><span>Código do curso (2 dígitos)</span><input name="codigo" type="text" inputmode="numeric" maxlength="2" pattern="[0-9]{2}" placeholder="Ex.: 01" title="Informe exatamente dois dígitos." required></label>
                    <label class="admin-field"><span>Nome do curso</span><input name="nome" required></label>
                    <label class="admin-field"><span>Unidade acadêmica</span><input name="unidade" required></label>
                    <label class="admin-field"><span>Grau acadêmico</span><select name="grau" required><option value="" selected disabled>Selecione o grau acadêmico</option><option value="Bacharelado">Bacharelado</option><option value="Licenciatura">Licenciatura</option><option value="Tecnólogo">Tecnólogo</option><option value="Pós-Graduação">Pós-Graduação</option><option value="Mestrado">Mestrado</option><option value="Pós Doutorado">Pós Doutorado</option></select></label>
                    <label class="admin-field"><span>Duração (semestres)</span><input name="duracao" type="number" min="1" max="20" required></label>
                    <label class="admin-field"><span>Modalidade</span><select name="modalidade" required><option value="" selected disabled>Selecione a modalidade</option><option value="Presencial">Presencial</option><option value="Semipresencial">Semipresencial</option><option value="Ensino a Distância (EAD)">Ensino a Distância (EAD)</option></select></label>
                    <label class="admin-field admin-field-wide"><span>Descrição</span><textarea name="descricao" rows="4" placeholder="Objetivos e informações do curso"></textarea></label>
                  </div>
                  <button class="admin-button" type="button">Cadastrar curso</button>
                </div>
              </section>
              <section class="admin-form-card" data-importacao-csv="cursos">
                <div class="admin-card-heading"><span class="admin-card-icon" aria-hidden="true">&#8645;</span><div><h3>Importação por CSV</h3><p>Confira os registros antes de importar.</p></div></div>
                <div class="admin-form-body"><label class="admin-file-field"><strong>Arquivo CSV</strong><small></small><input type="file" accept=".csv,text/csv"></label><p role="status">Selecione um CSV para visualizar os registros.</p><div class="admin-table-wrap"><table class="admin-table" aria-label="Prévia da importação"><thead><tr></tr></thead><tbody></tbody></table></div><button class="admin-button" type="button" disabled>Importar registros válidos</button></div>
              </section>            </article>
          </section>
          <div data-component="footer"></div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js"></script>
    <script src="../../js/admin/adicionar-curso.js"></script>
    <script src="../../js/admin/importacao-csv.js"></script>
  </body>
</html>
