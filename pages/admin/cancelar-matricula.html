<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cancelar matr&iacute;cula | NotaDez</title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/admin/paginas.css">
  </head>
  <body>
    <div id="app" data-page="cancelar-matricula" data-role="admin" data-title="Cancelar matr&iacute;cula">
      <div class="shell">
        <aside class="side" data-component="sidebar"></aside>
        <main class="main">
          <div data-component="header"></div>
          <section class="content">
            <article class="admin-page">
              <div class="admin-page-intro">
                <span class="admin-eyebrow">Gest&atilde;o de matr&iacute;culas</span>
                <h2>Cancelar matr&iacute;cula</h2>
                <p>Localize a matr&iacute;cula e registre o motivo do cancelamento.</p>
              </div>
              <section class="admin-form-card admin-form-card-narrow">
                <div class="admin-card-heading admin-card-heading-danger">
                  <span class="admin-card-icon" aria-hidden="true">&#10005;</span>
                  <div><h3>Dados da solicita&ccedil;&atilde;o</h3><p>Confira a identifica&ccedil;&atilde;o antes de continuar.</p></div>
                </div>
                <div class="admin-form-body">
                  <div class="admin-field-grid">
                    <label class="admin-field"><span>Identificador da matr&iacute;cula</span><input name="matricula" placeholder="Informe o identificador da matr&iacute;cula" required></label>
                    <label class="admin-field"><span>CPF do aluno</span><input name="cpf" inputmode="numeric" placeholder="Informe o CPF do aluno" required></label>
                    <label class="admin-field"><span>Data efetiva do cancelamento</span><input name="data" type="date" required></label>
                    <div class="admin-field admin-field-unavailable"><span>Motivo</span><p>Op&ccedil;&otilde;es n&atilde;o dispon&iacute;veis.</p></div>
                    <label class="admin-field admin-field-wide"><span>Observa&ccedil;&otilde;es</span><textarea name="observacoes" rows="4" placeholder="Registre detalhes relevantes"></textarea></label>
                  </div>
                  <label class="admin-confirm-field"><input type="checkbox" name="confirmacao" required><span>Confirmo que revisei os dados e a solicita&ccedil;&atilde;o.</span></label>
                  <button class="admin-button admin-button-danger" type="button">Confirmar cancelamento</button>
                </div>
              </section>
            </article>
          </section>
          <div data-component="footer"></div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js"></script>
  </body>
</html>
