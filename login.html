<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Entrar | NotaDez
    </title>
    <link rel="stylesheet" href="css/shared/style.css">
  </head>
  <body>
    <main class="login">
      <section class="art">
        <div class="brand">
          <i aria-hidden="true">&#10022;</i> <span>NotaDez</span>
        </div>
        <div class="artcenter">
          <div class="visual" role="img" aria-label="Ilustra&#231;&#227;o de chap&#233;u de formatura">
            <svg viewBox="0 0 180 130" aria-hidden="true">
              <path d="M18 46 90 15l72 31-72 31L18 46Z" fill="#fff" opacity=".96"/>
              <path d="M48 60v30c23 18 61 18 84 0V60L90 76 48 60Z" fill="#dcd9ff"/>
              <path d="M162 47v42" stroke="#ffd166" stroke-width="5" stroke-linecap="round"/>
              <circle cx="162" cy="96" r="7" fill="#ffd166"/>
            </svg>
          </div>
          <h2>
            Sua jornada acad&#234;mica em um s&#243; lugar
          </h2>
        </div>
        <small>&copy; 2026 NotaDez Academic System. Todos os direitos reservados.</small>
      </section>
      <section class="loginpanel">
        <form class="loginform" id="login">
          <h1>
            Bem-vindo de volta!
          </h1>
          <div class="field">
            <label for="email">
              Endere&#231;o de e-mail
            </label>
            <input id="email" name="email" type="text" placeholder="Digite seu e-mail" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="senha">
              Sua senha
            </label>
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
          </div>
          <p class="login-links">
            <a href="recuperacao.html">Esqueceu a senha?</a>
          </p>
          <div id="error" class="error" role="alert" aria-live="polite">
          </div>
          <button class="btn primary full" type="submit">
            Entrar na conta
          </button>
        </form>
      </section>
    </main>
    <script src="js/shared/login.js">
    </script>
  </body>
</html>
