<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de disciplinas | NotaDez</title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/admin/paginas.css">
  </head>
  <body>
    <div
      id="app"
      data-page="adicionar-disciplina"
      data-role="admin"
      data-title="Cadastro de disciplinas"
    >
      <div class="shell">
        <aside class="side" data-component="sidebar"></aside>
        <main class="main">
          <div data-component="header"></div>
          <section class="content">
            <article class="admin-page">
              <div class="admin-page-intro">
                <span class="admin-eyebrow">Catálogo acadêmico</span>
                <h2>Cadastro de disciplinas</h2>
                <p>Cadastre disciplinas e associe cada uma ao semestre e curso correspondentes.</p>
              </div>
              <section class="admin-form-card admin-form-card-narrow">
                <div class="admin-card-heading">
                  <span class="admin-card-icon" aria-hidden="true">&#43;</span>
                  <div>
                    <h3>Dados da disciplina</h3>
                    <p>Defina os dados principais da disciplina.</p>
                  </div>
                </div>
                <div class="admin-form-body">
                  <div class="admin-field-grid">
                    <label class="admin-field">
                      <span>Nome</span>
                      <input name="nome" required>
                    </label>
                    <label class="admin-field">
                      <span>Curso</span>
                      <select name="curso" required>
                        <option value="" selected disabled>Carregando cursos...</option>
                      </select>
                    </label>
                    <label class="admin-field">
                      <span>Código</span>
                      <div class="admin-discipline-code">
                        <span class="admin-discipline-prefix" data-course-code-prefix aria-hidden="true">--</span>
                        <input name="codigoComplemento" type="text" maxlength="8" pattern="[A-Za-z0-9]{1,8}" placeholder="Ex.: MAT01" title="Use de 1 a 8 letras ou números para completar o código." autocomplete="off" required disabled>
                      </div>
                      <small class="admin-local-note">O prefixo de dois dígitos vem do curso selecionado.</small>
                    </label>
                    <label class="admin-field">
                      <span>Semestre</span>
                      <select name="semestre" required>
                        <option value="" selected disabled>Selecione o semestre</option>
                      </select>
                    </label>
                    <label class="admin-field admin-field-wide">
                      <span>Descrição</span>
                      <textarea name="descricao" rows="4" required></textarea>
                    </label>
                  </div>
                  <button class="admin-button" type="button">Cadastrar disciplina</button>
                  <p class="admin-local-note" data-discipline-status role="status" aria-live="polite"></p>
                </div>
              </section>
            </article>
          </section>
          <div data-component="footer"></div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js"></script>
    <script src="../../js/admin/cadastros-locais.js"></script>
  </body>
</html>
