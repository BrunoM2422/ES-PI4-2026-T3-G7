<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Dashboard do Aluno | NotaDez
    </title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/aluno/paginas.css">
    <link rel="stylesheet" href="../../css/shared/notificacoes.css">
  </head>
  <body>
    <div id="app" data-page="dashboard" data-role="aluno" data-title="Dashboard do Aluno">
      <div class="shell">
        <aside class="side" data-component="sidebar">
        </aside>
        <main class="main">
          <div data-component="header">
          </div>
          <section class="content">
            <article class="student-page-host">
              <div class="student-dashboard">
                <section class="student-page-panel student-dashboard-notifications">
                  <div class="student-dashboard-heading">
                    <h2>
                      Notificações Recentes
                    </h2>
                    <button type="button" id="btn-marcar-todas-lidas" class="notif-btn" hidden>
                      Marcar todas como lidas
                    </button>
                  </div>
                  <div class="notif-list" id="notif-list"></div>
                  <p class="student-dashboard-empty">
                    Nenhuma notificação recente.
                  </p>
                </section>
                <div class="student-dashboard-side">
                  <section class="student-page-panel student-dashboard-section">
                    <h2>
                      Próximas Atividades
                    </h2>
                    <p class="student-dashboard-empty">
                      Nenhuma atividade próxima.
                    </p>
                  </section>
                  <section class="student-page-panel student-dashboard-section">
                    <h2>
                      Agenda Geral
                    </h2>
                    <p class="student-dashboard-empty">
                      Nenhum evento na agenda.
                    </p>
                  </section>
                </div>
              </div>
            </article>
          </section>
          <div data-component="footer">
          </div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js"></script>
    <script src="../../js/shared/notificacoes.js"></script>
  <script src="../../js/aluno/dashboard.js"></script>
  </body>
</html>
