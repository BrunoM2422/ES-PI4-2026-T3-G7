<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adicionar administrador | NotaDez</title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/admin/paginas.css">
  </head>
  <body>
    <div
      id="app"
      data-page="adicionar-administrador"
      data-role="admin"
      data-title="Adicionar administrador"
    >
      <div class="shell">
        <aside class="side" data-component="sidebar"></aside>
        <main class="main">
          <div data-component="header"></div>
          <section class="content">
            <article class="admin-page">
              <div class="admin-page-intro">
                <span class="admin-eyebrow">Gest&atilde;o de acesso</span>
                <h2>Adicionar administrador</h2>
                <p>Informe os dados e o n&iacute;vel de permiss&atilde;o do novo administrador.</p>
              </div>
              <section class="admin-form-card admin-form-card-narrow">
                <div class="admin-card-heading">
                  <span class="admin-card-icon" aria-hidden="true">&#43;</span>
                  <div>
                    <h3>Dados do administrador</h3>
                    <p>Todos os campos s&atilde;o obrigat&oacute;rios.</p>
                  </div>
                </div>
                <div class="admin-form-body">
                  <div class="admin-field-grid">
                    <label class="admin-field admin-field-wide">
                      <span>Nome completo</span>
                      <input name="nome" autocomplete="name" required>
                    </label>
                    <label class="admin-field">
                      <span>E-mail</span>
                      <input name="email" type="email" autocomplete="email" required>
                    </label>
                    <label class="admin-field">
                      <span>Telefone</span>
                      <input name="telefone" type="tel" autocomplete="tel" required>
                    </label>
                    <label class="admin-field admin-field-wide">
                      <span>N&iacute;vel de permiss&atilde;o</span>
                      <select name="permissao" required>
                        <option value="" selected disabled>Selecione o n&iacute;vel de permiss&atilde;o</option>
                        <option>Administrador</option>
                        <option>Administrador acad&ecirc;mico</option>
                        <option>Administrador de sistema</option>
                      </select>
                    </label>
                  </div>
                  <button class="admin-button" type="button">Cadastrar administrador</button>
                  <p class="admin-local-note" role="status"></p>
                </div>
              </section>
            </article>
          </section>
          <div data-component="footer"></div>
        </main>
      </div>
    </div>
    <script src="../../js/shared/app.js"></script>
    <script src="../../js/admin/cadastros-locais.js"></script>
  </body>
</html>
