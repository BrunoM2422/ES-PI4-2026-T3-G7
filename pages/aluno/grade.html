<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grade Curricular | NotaDez</title>
    <link rel="stylesheet" href="../../css/shared/style.css">
    <link rel="stylesheet" href="../../css/aluno/paginas.css">
  </head>
  <body>
    <div id="app" data-page="grade" data-role="aluno" data-title="Grade Curricular">
      <div class="shell">
        <aside class="side" data-component="sidebar"></aside>
        <main class="main">
          <div data-component="header"></div>
          <section class="content">
            <article class="student-page-host">
              <div class="student-page-layout curriculum-page">
                <div class="curriculum-toolbar">
                  <div><h2>Grade Curricular</h2><p data-course-name>Monte sua grade escolhendo disciplinas e turmas.</p></div>
                  <button type="button" class="curriculum-save-button" data-save-grade disabled>Salvar alterações</button>
                </div>
                <section class="curriculum-catalog-panel" aria-label="Catálogo de disciplinas">
                  <div class="curriculum-filters">
                    <label><span>Pesquisar matérias</span><input type="search" data-search-subject placeholder="Nome ou código da matéria"></label>
                    <label><span>Filtro</span><select data-semester-filter><option value="todos">Escolha um semestre</option><option value="atuais">Matérias Atuais</option></select></label>
                  </div>
                  <p class="curriculum-feedback" data-grade-status role="status">Carregando matérias...</p>
                  <div class="curriculum-subject-cards" data-subject-cards></div>
                </section>
                <section class="curriculum-week-panel" aria-label="Minha grade semanal">
                  <div class="curriculum-week-heading"><div><h3>Minha grade semanal</h3><p>Os conflitos de horário são impedidos automaticamente.</p></div><span data-selection-count>0 matérias selecionadas</span></div>
                  <div class="curriculum-week-scroll"><div class="curriculum-week-grid" data-week-grid></div></div>
                </section>
              </div>
            </article>
          </section>
          <div data-component="footer"></div>
        </main>
      </div>
    </div>
    <div class="curriculum-modal-root" data-class-modal-root></div>
    <script src="../../js/shared/app.js"></script>
    <script src="../../js/aluno/grade.js"></script>
  </body>
</html>
